name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fb0f294c5e605969 # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@a18c1f3aa75e2adf76e0cae9c6c2e87aef587e3e # 3.1.1
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: composer test

      # Coverage + Codecov upload are enabled in Phase 1, once `src/` contains
      # code to measure. While `src/` is empty, generating coverage produces a
      # "source filter does not match any files" warning that fails the run under
      # failOnWarning. The CODECOV_TOKEN secret is already configured and ready.

  phpstan:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fb0f294c5e605969 # 2.35.5
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@a18c1f3aa75e2adf76e0cae9c6c2e87aef587e3e # 3.1.1

      - name: Run PHPStan
        run: composer phpstan

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fb0f294c5e605969 # 2.35.5
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@a18c1f3aa75e2adf76e0cae9c6c2e87aef587e3e # 3.1.1

      - name: Check coding standards
        run: composer cs-check
